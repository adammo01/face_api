version: "3.8"

# 用法:
#   docker compose up -d
#   curl http://localhost:8000/healthz
#
# 公网 URL (假设 Nginx 反代在 443):
#   export FACE_BLUR_PUBLIC_URL=https://your-domain.com
#   docker compose up -d

services:
  faceblur:
    build: .
    image: faceblur-api:1.0.0
    container_name: faceblur-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化打码图 (避免容器重启丢图)
      - ./static:/app/static
      # 模型缓存 (避免镜像层太大)
      - ./models:/models
    environment:
      - FACE_BLUR_STATIC_DIR=/app/static
      - FACE_BLUR_MODEL_DIR=/models
      - FACE_BLUR_PUBLIC_URL=${FACE_BLUR_PUBLIC_URL:-}
      - FACE_BLUR_API_TOKEN=${FACE_BLUR_API_TOKEN:-}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3